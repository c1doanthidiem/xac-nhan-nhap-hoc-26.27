<!doctype html>
<title>THANH TOÁN CÁC KHOẢN PHÍ ĐẦU NĂM HỌC - Trường Tiểu học Đoàn Thị Điểm - Hà Nội</title> 
<title>Trường Tiểu học Đoàn Thị Điểm</title>
<style>
:root{--primary:#0b6fb3;--muted:#6b7280;--card:#ffffff;--accent:#0b76d1;}
*{box-sizing:border-box;font-family:Inter, system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial;}
body{margin:0;background:#f6fbff;color:#0b1720;}
.container{max-width:920px;margin:24px auto;padding:18px;}
.header{display:flex;gap:14px;align-items:center;padding:12px 0;}
.logo{width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 6px 18px rgba(11,111,179,0.08);}
.school{font-size:18px;font-weight:700;color:var(--primary);}
.subtitle{font-size:13px;color:var(--muted);}
.card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,0.04);}
form .row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
label{font-size:13px; color:var(--primary); font-weight:600; display:block; margin-bottom:6px;}
input[type="text"], input[type="tel"], select{padding:10px 12px;border:1px solid #e6eef8;border-radius:8px;width:100%;min-width:0;font-size:15px;background:#fff;}
.col-2{flex:1 1 48%;min-width:160px;}
.col-3{flex:1 1 30%;min-width:120px;}
.actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
button{background:var(--primary);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600;}
button.ghost{background:#eef6ff;color:var(--primary);border:1px solid rgba(11,111,179,0.12);}
.qr-area{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:18px;}
.qr-box{background:#fff;padding:12px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:220px;min-height:120px;box-shadow:0 6px 18px rgba(15,23,42,0.04);}
.transfer-info{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:8px;border:1px dashed #e6eef8;font-family:monospace;flex:1;min-width:260px;}
.small{font-size:13px;color:var(--muted);margin-top:8px;}
.center{display:flex;align-items:center;justify-content:center;}
.footer{margin-top:14px;color:var(--muted);font-size:13px;text-align:center;}
.amounts{display:flex;gap:8px;flex-wrap:wrap;}
.amounts label{background:#f1fbff;padding:8px 10px;border-radius:8px;border:1px solid rgba(11,111,179,0.06);cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--primary);}
@media (max-width:640px){ .col-2{flex-basis:100%} .col-3{flex-basis:48%} .logo{width:56px;height:56px} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><img src='logo.jpg.jpg' style='width:100%;height:100%;object-fit:contain'/></div>
    <div>
      <div class="school">Trường Tiểu học Đoàn Thị Điểm - Hà Nội</div>
      <div class="subtitle">Tuyển sinh lớp 1 bán trú năm học 2026-2027 - Hoàn thiện thủ tục xác nhận nhập học</div>
    </div>
  </div>

  <div class="card">
    <form id="feeForm" onsubmit="return false;">
     <div class="row">
  <!-- Họ và tên -->
  <div class="col-3" style="max-width: 260px;">
  <label>Họ và tên Học sinh</label>
  <input 
    id="fullname" 
    type="text" 
    placeholder="Nguyễn Văn A" 
    required 
    oninput="
      this.value = this.value
        .replace(/[^A-Za-zÀ-ỹ\s]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trimStart()
        .split(' ')
        .map(word => {
          if (word.length === 0) return '';
          let first = word.charAt(0).toUpperCase();
          let rest = word.slice(1).toLowerCase();
          
          if (word === 'bui') return 'Bùi';
          if (word === 'nguyen') return 'Nguyễn';
          if (word === 'tran') return 'Trần';
          if (word === 'le') return 'Lê';
          if (word === 'pham') return 'Phạm';
          if (word === 'hoang') return 'Hoàng';
          if (word === 'vu') return 'Vũ';
          if (word === 'dang') return 'Đặng';
          if (word === 'do') return 'Đỗ';
          
          return first + rest;
        })
        .join(' ');
    "
  >
</div>

  <!-- Ngày sinh -->
  <div class="col-3">
    <label>Ngày sinh</label>
    <div style="display:flex; gap:8px;">
      <!-- Ngày -->
      <select id="day" style="flex:1;">
        <option value="">Ngày</option>
        <script>
          for(let i = 1; i <= 31; i++) {
            document.write(`<option value="${i}">${i}</option>`);
          }
        </script>
      </select>

      <!-- Tháng -->
      <select id="month" style="flex:1;">
        <option value="">Tháng</option>
        <script>
          for(let i = 1; i <= 12; i++) {
            document.write(`<option value="${i}">${i}</option>`);
          }
        </script>
      </select>

      <!-- Năm -->
      <select id="year" style="flex:1;">
        <option value="">Năm</option>
        <option value="2019">2019</option>
        <option value="2020">2020</option>
      </select>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-6">
    <label>Cơ sở đăng kí tuyển sinh</label>
    <select id="campus" class="form-control">
      <option value="MD">Mỹ Đình</option>
      <option value="CN">Cổ Nhuế</option>
    </select>
  </div>

  <div class="col-6">
    <label>Hệ học</label>
    <select id="program" class="form-control"></select>
  </div>
</div>

<script>
  const campusSelect = document.getElementById("campus");
  const programSelect = document.getElementById("program");

  function updateProgram() {
    const campus = campusSelect.value;

    let options = "";

    if (campus === "MD") {
      options = `
        <option value="PA">Hệ tăng cường Tiếng Pháp và Tiếng Anh</option>
        <option value="TA">Hệ tăng cường Tiếng Anh</option>
        <option value="CAM">Hệ Quốc tế Cambridge</option>
        <option value="OF">Hệ Quốc tế Oxford</option>
      `;
    } else if (campus === "CN") {
      options = `
        <option value="TA">Hệ tăng cường Tiếng Anh</option>
      `;
    }

    programSelect.innerHTML = options;
    programSelect.selectedIndex = 0;
  }
  campusSelect.addEventListener("change", updateProgram);

  updateProgram();
</script>


 <div class="col-2">
  <label>Số điện thoại CMHS (Số đăng ký nhận thông báo ZALO của Trường)</label>
  
  <input 
    id="phone"
    type="tel"
    style="margin-bottom:15px;"
    placeholder="0912345678"
    pattern="[0-9]{10}"
    maxlength="10"
    inputmode="numeric"
    required
    oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10);"
  >
      <div class="row">
        <div style="width:100%">
       <label>Các khoản kinh phí đầu năm học<label>
<div class="amounts" id="amounts">
  <label>
    <input type="radio" name="amount" value="7000000" checked>
    7.000.000₫

</label>
<a href="./kinhphi.pdf.pdf" target="_blank" 
   style="
     font-size:14px;
     font-weight:500;
     color:#4a2dbd;
     text-decoration:none;
     padding:6px 10px;
     border-radius:6px;
     background:#f3f0ff;
   "> CÁC KHOẢN PHÍ LỚP 1 VÀ QUY ĐỊNH VỀ TÀI CHÍNH </a>
    </div>

<div class="actions">
  <button id="generateBtn" type="button">Tạo mã QR</button>
  <button id="downloadQR" class="ghost" type="button">Tải ảnh QR</button>

  <div style="margin-left:auto;text-align:right">
    <div style="font-size:13px;color:var(--muted)">Ngân hàng: BIDV</div>
    <div style="font-weight:700">STK: 2200263666</div>
    <div style="font-size:13px;color:var(--muted)">
      Chủ tài khoản: Trường Tiểu học Đoàn Thị Điểm - Hà Nội
    </div>
  </div>
</div>

<div id="transferNote"
     style="display:none;
            background:#e3f2fd;
            color:#0d47a1;
            padding:12px;
            border-radius:6px;
            margin:15px 0;
            font-weight:500;
            line-height:1.6;">
  Sau khi hoàn tất chuyển khoản, trong vòng <strong>1–3 ngày làm việc</strong>,
  Nhà trường sẽ kiểm tra thông tin và gửi thông báo xác nhận qua <strong>Zalo</strong>
  tới Cha mẹ học sinh.
</div>

<div class="qr-area">
  <div class="qr-box" id="qrcode">
    <div class="small">Mã QR sẽ hiển thị ở đây</div>
  </div>
  <div class="transfer-info" id="transferInfo">
    Nội dung chuyển khoản sẽ hiển thị tại đây.
  </div>
</div>

<script>
const BANK = {
  code: "970418",
  bankShort: "BIDV",
  account: "2200263666",
  owner: "Trường Tiểu học Đoàn Thị Điểm - Hà Nội"
};

function el(id) { 
  return document.getElementById(id); 
}

function getSelectedAmount() {
  const radios = document.getElementsByName('amount');
  for (const r of radios) {
    if (r.checked) return r.value;
  }
  return "7000000";
}

function makeNote() {
  const fullname = (el('fullname').value || "").trim();
  const day = el('day').value.padStart(2, '0');
  const month = el('month').value.padStart(2, '0');
  const year = el('year').value;
  const campus = el('campus').value;
  const program = el('program').value;
  const phone = (el('phone').value || "").trim();

  return `Lop 1 ${fullname} ${day}.${month}.${year} ${campus} ${program} ${phone}`;
}

function buildQRUrl(amount, note) {
  const memo = encodeURIComponent(note);
  return `https://qr.sepay.vn/img?acc=${BANK.account}&bank=${BANK.code}&amount=${amount}&des=${memo}`;
}

function generate() {
  const fullname = (el('fullname').value || "").trim();
  const day = el('day').value;
  const month = el('month').value;
  const year = el('year').value;
  const campus = el('campus').value;
  const program = el('program').value;
  const phone = (el('phone').value || "").trim();
  const amount = getSelectedAmount();

  if (!fullname || !day || !month || !year || !campus || !program || !phone) {
    alert("Vui lòng điền đầy đủ thông tin trước khi tạo mã QR.");
    return;
  }

  if (!/^[0-9]{10}$/.test(phone)) {
    alert("Số điện thoại phải đúng 10 chữ số.");
    return;
  }

  const note = makeNote();
  const url = buildQRUrl(amount, note);

  const infoHTML = `
    Ngân hàng: ${BANK.bankShort}<br>
    STK: ${BANK.account}<br>
    Chủ TK: ${BANK.owner}<br>
    Số tiền: ${Number(amount).toLocaleString('vi-VN')} ₫<br><br>
    Nội dung: ${note}
  `;

  el('transferInfo').innerHTML = infoHTML;
  el('transferNote').style.display = "block";

  // Tạo QR
  const q = el('qrcode');
  q.innerHTML = `<img src="${url}" style="width:260px; border-radius:8px;">`;
}

el('generateBtn').addEventListener('click', generate);

el('downloadQR').addEventListener('click', () => {
  const img = el('qrcode').querySelector('img');
  if (!img) {
    alert("Vui lòng nhấn 'Tạo mã QR' trước khi tải.");
    return;
  }
  const a = document.createElement('a');
  a.href = img.src;
  a.download = `dong_hoc_phi_${Date.now()}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});
</script>
</script>

<style>
/* ===== FIX MOBILE FULL ===== */
@media (max-width: 768px){

  .container{
    padding:12px;
    margin:0;
  }

  form .row{
    flex-direction: column;
  }

  .col-2, .col-3, .col-6{
    flex: 1 1 100% !important;
    max-width: 100% !important;
  }

  input, select{
    width: 100% !important;
    font-size:16px;
  }

  .row div[style*="display:flex"]{
    flex-direction: row;
    gap:6px;
  }

  .qr-area{
    flex-direction: column;
    align-items: stretch;
  }

  .qr-box,
  .transfer-info{
    width:100%;
  }

  .actions{
    flex-direction: column;
    align-items: stretch;
  }

  button{
    width:100%;
  }

  .actions > div{
    text-align:left !important;
    margin-left:0 !important;
  }

  .school{
    font-size:16px;
  }

  .subtitle{
    font-size:12px;
  }
}
</style>

</body>
</html>
